<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>평수 계산기</title>
<style>
  :root{
    --bg:#f6f4ef;
    --surface:#ffffff;
    --ink:#1f1d1a;
    --ink-dim:#6b6558;
    --line:#dfdacc;
    --accent:#b5502e;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171512;
      --surface:#211e1a;
      --ink:#f1ede3;
      --ink-dim:#9a9284;
      --line:#38332b;
      --accent:#e08357;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171512;
    --surface:#211e1a;
    --ink:#f1ede3;
    --ink-dim:#9a9284;
    --line:#38332b;
    --accent:#e08357;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR","Pretendard",-apple-system,sans-serif;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    padding-block:48px;
    display:flex;
    justify-content:center;
  }
  main{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }
  header{
    text-align:center;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .eyebrow{
    font-family:"Spectral","Noto Serif KR",serif;
    font-style:italic;
    font-size:13px;
    color:var(--accent);
    letter-spacing:0.04em;
  }
  h1{
    font-family:"Spectral","Noto Serif KR",serif;
    font-size:28px;
    font-weight:600;
    margin:0;
    text-wrap:balance;
  }
  .sub{
    color:var(--ink-dim);
    font-size:13.5px;
    margin:0;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .field label{
    font-size:12.5px;
    letter-spacing:0.05em;
    color:var(--ink-dim);
    display:flex;
    justify-content:space-between;
  }
  .field label .unit-tag{
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    font-weight:600;
  }
  .input-row{
    display:flex;
    align-items:baseline;
    border-bottom:1.5px solid var(--line);
    padding-block:6px;
    transition:border-color .15s ease;
  }
  .input-row:focus-within{
    border-color:var(--accent);
  }
  .input-row input{
    flex:1;
    min-width:0;
    border:none;
    outline:none;
    background:transparent;
    color:var(--ink);
    font-family:"Spectral","Noto Serif KR",serif;
    font-size:32px;
    font-variant-numeric:tabular-nums;
    padding:0;
  }
  .input-row input::placeholder{
    color:var(--ink-dim);
    opacity:0.5;
  }
  .input-row .suffix{
    font-size:15px;
    color:var(--ink-dim);
    padding-left:8px;
    white-space:nowrap;
  }

  .swap-divider{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--ink-dim);
    font-size:11.5px;
    letter-spacing:0.08em;
  }
  .swap-divider::before,
  .swap-divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .factor-note{
    text-align:center;
    color:var(--ink-dim);
    font-size:12px;
    font-variant-numeric:tabular-nums;
  }
  .factor-note strong{
    color:var(--ink);
    font-weight:600;
  }

  .ref{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .ref h2{
    font-size:12.5px;
    letter-spacing:0.08em;
    color:var(--ink-dim);
    font-weight:600;
    margin:0;
  }
  .ref-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:8px;
  }
  .ref-item{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    cursor:pointer;
    font-size:13px;
    transition:border-color .15s ease, background .15s ease;
    min-width:0;
  }
  .ref-item:hover{
    border-color:var(--accent);
  }
  .ref-item .name{
    color:var(--ink);
    font-weight:600;
  }
  .ref-item .val{
    color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  footer{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-dim);
  }

  @media (max-width: 400px){
    .ref-grid{grid-template-columns:1fr;}
    h1{font-size:24px;}
    .input-row input{font-size:26px;}
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<main>
  <header>
    <span class="eyebrow">부동산 면적 환산</span>
    <h1>평수 계산기</h1>
    <p class="sub">평(坪)과 제곱미터(㎡)를 실시간으로 자동 변환합니다</p>
  </header>

  <div class="card">
    <div class="field">
      <label><span>평</span><span class="unit-tag">坪</span></label>
      <div class="input-row">
        <input id="pyeong" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
        <span class="suffix">평</span>
      </div>
    </div>

    <div class="swap-divider">자동 변환</div>

    <div class="field">
      <label><span>제곱미터</span><span class="unit-tag">㎡</span></label>
      <div class="input-row">
        <input id="sqm" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
        <span class="suffix">㎡</span>
      </div>
    </div>

    <p class="factor-note">1평 = <strong>3.305785</strong>㎡ · 1㎡ = <strong>0.3025</strong>평</p>
  </div>

  <div class="ref">
    <h2>자주 찾는 아파트 평형 (탭하여 입력)</h2>
    <div class="ref-grid" id="refGrid"></div>
  </div>

  <footer>한국 부동산 표준 환산 계수 기준</footer>
</main>

<script>
  const PYEONG_TO_SQM = 3.305785;
  const pyeongInput = document.getElementById('pyeong');
  const sqmInput = document.getElementById('sqm');
  let updating = false;

  function formatNumber(n){
    if (!isFinite(n)) return '';
    return (Math.round(n * 10000) / 10000).toString();
  }

  pyeongInput.addEventListener('input', () => {
    if (updating) return;
    updating = true;
    const v = parseFloat(pyeongInput.value);
    sqmInput.value = isNaN(v) ? '' : formatNumber(v * PYEONG_TO_SQM);
    updating = false;
  });

  sqmInput.addEventListener('input', () => {
    if (updating) return;
    updating = true;
    const v = parseFloat(sqmInput.value);
    pyeongInput.value = isNaN(v) ? '' : formatNumber(v / PYEONG_TO_SQM);
    updating = false;
  });

  const standardSizes = [
    { name: '방2 소형', sqm: 59 },
    { name: '국민평형', sqm: 84 },
    { name: '중대형', sqm: 114 },
    { name: '대형', sqm: 135 }
  ];

  const refGrid = document.getElementById('refGrid');
  standardSizes.forEach(({ name, sqm }) => {
    const pyeong = formatNumber(sqm / PYEONG_TO_SQM);
    const item = document.createElement('div');
    item.className = 'ref-item';
    item.innerHTML = `<span class="name">${name}</span><span class="val">${pyeong}평 · ${sqm}㎡</span>`;
    item.addEventListener('click', () => {
      sqmInput.value = sqm;
      sqmInput.dispatchEvent(new Event('input'));
    });
    refGrid.appendChild(item);
  });

  try {
    pyeongInput.value = '32';
    pyeongInput.dispatchEvent(new Event('input'));
  } catch (e) {}
</script>
</body>
</html>
